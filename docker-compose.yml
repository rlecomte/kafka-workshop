# Infrastructure du workshop.
#
#   docker compose up -d etcd     # nécessaire à partir du chapitre 6
#   docker compose run --rm kcat -b localhost:9092 -L
#   docker compose run --rm kafka-tools kafka-topics.sh --bootstrap-server localhost:9092 --list
#
# Les services utilisent le réseau de l'hôte pour joindre le broker qui
# tourne en local via `cargo run`.
services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.17
    network_mode: host
    command:
      - etcd
      - --name=workshop
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://localhost:2379
    volumes:
      - etcd-data:/etcd-data

  # Client Kafka en ligne de commande (basé sur librdkafka).
  kcat:
    image: edenhill/kcat:1.7.1
    network_mode: host
    profiles: [tools]

  # Les outils en ligne de commande officiels de Kafka (clients Java).
  kafka-tools:
    image: apache/kafka:4.1.0
    network_mode: host
    profiles: [tools]
    entrypoint: []
    environment:
      PATH: /opt/kafka/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      KAFKA_LOG4J_OPTS: -Dlog4j2.configurationFile=/opt/kafka/config/tools-log4j2.yaml

volumes:
  etcd-data:
